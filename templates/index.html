<!DOCTYPE html>
<html>
<head>
<title>Vehicle Dashboard</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body {
  font-family: Arial;
  text-align: center;
  margin: 0;
}

h2 {
  margin-top: 10px;
}

#map {
  height: 300px;
  width: 95%;
  margin: auto;
  margin-top: 10px;
}

select {
  padding: 8px;
  margin: 10px;
}

table {
  border-collapse: collapse;
  margin: auto;
  margin-top: 10px;
  width: 95%;
}

td, th {
  border: 1px solid black;
  padding: 6px;
}

.date-row {
  font-weight: bold;
  text-align: center;
}
</style>

</head>

<body>

<h2>Vehicle Dashboard</h2>

<!-- HISTORY DROPDOWN -->
<select id="history" onchange="showHistory(this.value)">
<option value="">Live</option>
</select>

<!-- MAP -->
<div id="map"></div>

<!-- LOG TABLE -->
<table>
<thead>
<tr>
<th>Sr</th>
<th>User</th>
<th>Time</th>
</tr>
</thead>
<tbody id="log"></tbody>
</table>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// -------- MAP INIT --------
let map = L.map('map').setView([16.7, 74.2], 15);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png')
.addTo(map);

let marker = L.marker([16.7, 74.2]).addTo(map);

// -------- STATE --------
let historyMode = false;
let lastInteraction = Date.now();

// -------- TRACK USER MOVEMENT --------
map.on("move", () => {
  lastInteraction = Date.now();
});

// -------- UPDATE LOOP --------
function update() {

  fetch("/api/data")
  .then(r => r.json())
  .then(data => {

    // ---- MAP ----
    if (!historyMode && data.gps.lat) {

      let lat = data.gps.lat;
      let lon = data.gps.lon;

      marker.setLatLng([lat, lon]);

      if (Date.now() - lastInteraction > 15000) {
        map.setView([lat, lon], 15);
      }
    }

    // ---- LOG TABLE ----
    let html = "";
    let lastDate = "";

    data.logs.forEach(l => {

      if (l.date !== lastDate) {
        html += `<tr>
          <td colspan="3" class="date-row">${l.date}</td>
        </tr>`;
        lastDate = l.date;
      }

      html += `<tr>
        <td>${l.id}</td>
        <td>${l.user}</td>
        <td>${l.on}</td>
      </tr>`;
    });

    document.getElementById("log").innerHTML = html;
  });
}

setInterval(update, 2000);

// -------- LOAD HISTORY --------
fetch("/api/history")
.then(r => r.json())
.then(h => {

  let opt = '<option value="">Live</option>';

  h.forEach((e,i) => {
    opt += `<option value="${i}">
      ${new Date(e.time).toLocaleTimeString([], {
        hour:'2-digit',
        minute:'2-digit'
      })}
    </option>`;
  });

  document.getElementById("history").innerHTML = opt;
});

// -------- SHOW HISTORY --------
function showHistory(i) {

  if (i === "") {
    historyMode = false;
    return;
  }

  historyMode = true;

  fetch("/api/history")
  .then(r => r.json())
  .then(h => {

    let p = h[i];

    marker.setLatLng([p.lat, p.lon]);
    map.setView([p.lat, p.lon], 15);
  });
}

</script>

</body>
</html>
